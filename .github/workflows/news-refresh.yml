name: Daily news refresh

on:
  schedule:
    - cron: "0 11 * * *"   # ~06:00 ET daily
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-news.txt

      - name: Run news refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/news_refresh.sh

      - name: Commit changes
        run: |
          git config user.name "news-refresh[bot]"
          git config user.email "actions@github.com"
          # Real-news signal lives in data/ (news index + records.jsonl); .txt bodies are gitignored.
          # web/public/data is rebuilt every run (build-metadata churn) so it must NOT gate the commit,
          # else the cron commits an empty "daily refresh" every day.
          # data/news/health.json's checked_at timestamp ALSO changes every run, so it must be
          # excluded from the gate too — otherwise every quiet day would commit + deploy. It still
          # rides along in the commit on days with real news.
          git add data/
          if git diff --staged --quiet -- . ':(exclude)data/news/health.json'; then
            echo "No news changes; discarding build + health churn."
            git checkout -- web/public/data/ 2>/dev/null || true
            git restore --staged data/news/health.json 2>/dev/null || true
          else
            git add -f web/public/data/   # -f: web/public/data is gitignored; stage rebuilt dossiers
            git add data/news/health.json # ride along with the real-news commit
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "news: daily refresh ${DATE}"
            git push   # push triggers Vercel auto-deploy via Git integration
          fi

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "News refresh failed $(date -u +%Y-%m-%d)" \
            --body "The daily news-refresh workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "news-refresh-failure" || true
